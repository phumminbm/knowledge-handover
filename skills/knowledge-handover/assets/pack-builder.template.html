<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Knowledge Pack Builder</title>
<style id="kh-fonts">
/*__FONTS__*/
</style>
<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
/* Same system as START-HERE.html: white surfaces, near-black ink, pill controls, colour only in soft orbs. */
:root{--bg:#fff;--surface:#f6f6f5;--ink:#0b0b0b;--muted:#5f5f5c;--hair:#e6e6e4;--ok:#2f6b3a;--bad:#b42318;--warn-fg:#7a4a00;
--orb1:#f4a27e;--orb2:#e7dcff;--orb3:#dbeafc;--r-pill:999px;--r-lg:24px;--r-md:16px;--r-sm:12px;
--sans:'Poppins','Prompt',system-ui,sans-serif;--head:'Prompt','Poppins',system-ui,sans-serif;--mono:ui-monospace,Menlo,Consolas,monospace}
body{font-family:var(--sans);background:var(--bg);color:var(--ink);line-height:1.6}
.page{overflow-x:clip}
.wrap{max-width:720px;margin:0 auto;padding:2.2rem max(1rem,env(safe-area-inset-right,0px)) 4rem max(1rem,env(safe-area-inset-left,0px))}
header{position:relative;padding:1.4rem 0 .4rem}
header>*{position:relative}
.orb{position:absolute!important;border-radius:50%;filter:blur(42px);pointer-events:none;z-index:0}
.o1{width:340px;height:340px;right:-150px;top:-180px;background:radial-gradient(circle at 35% 35%,#fff 0%,var(--orb1) 42%,transparent 70%);opacity:.85}
.o2{width:260px;height:260px;right:120px;top:-150px;background:radial-gradient(circle,var(--orb2),transparent 68%);opacity:.85}
.o3{width:200px;height:200px;right:20px;top:30px;background:radial-gradient(circle,var(--orb3),transparent 68%);opacity:.7}
.topline{display:flex;justify-content:space-between;align-items:center;gap:1rem}
.eyebrow{font-size:.76rem;color:var(--muted)}
.lang{display:inline-flex;gap:2px;padding:3px;border-radius:var(--r-pill);background:var(--surface);font-size:.8rem}
.lang button{border:0;background:none;border-radius:var(--r-pill);padding:.2rem .75rem;color:var(--muted);cursor:pointer;font-family:var(--sans)}
.lang button.on{background:var(--bg);color:var(--ink);font-weight:500;box-shadow:0 1px 3px rgba(0,0,0,.1)}
h1{font-family:var(--head);font-weight:400;font-size:clamp(2rem,3vw + 1rem,2.8rem);line-height:1.12;letter-spacing:-.02em;margin-top:1rem;text-wrap:balance}
h1 em{font-style:normal}
.lede{color:var(--muted);margin:.6rem 0 0;max-width:60ch}
.progress{list-style:none;display:flex;flex-wrap:wrap;gap:.4rem;margin:1.6rem 0 1.2rem}
.progress li{display:flex;align-items:center;gap:.5rem;font-size:.82rem;color:var(--muted);background:var(--surface);border-radius:var(--r-pill);padding:.3rem .8rem .3rem .35rem}
.progress .n{width:22px;height:22px;border-radius:50%;background:var(--bg);border:1px solid #cfcfcc;display:flex;align-items:center;justify-content:center;font-size:.72rem;font-weight:600}
.progress li.done{color:var(--ink)}
.progress li.done .n{background:var(--ink);border-color:var(--ink);color:#fff}
.step{border:1px solid var(--hair);border-radius:var(--r-lg);padding:1.3rem 1.4rem;margin-bottom:.9rem;background:var(--bg)}
.step h2{font-family:var(--head);font-size:1.05rem;font-weight:500;margin-bottom:.7rem;display:flex;gap:.6rem;align-items:center}
.step h2 .n{flex:none;width:24px;height:24px;border-radius:50%;background:var(--ink);color:#fff;font:600 .74rem var(--sans);display:flex;align-items:center;justify-content:center}
textarea{width:100%;min-height:180px;font-family:var(--mono);font-size:.78rem;border:1px solid var(--hair);border-radius:var(--r-sm);padding:.75rem .85rem;resize:vertical;background:var(--surface);color:var(--ink)}
textarea:focus,input:focus-visible,button:focus-visible,.drop:focus-visible{outline:2px solid var(--ink);outline-offset:2px}
.drop{border:1.5px dashed #cfcfcc;border-radius:var(--r-md);padding:1.4rem;text-align:center;color:var(--muted);font-size:.88rem;cursor:pointer;background:var(--surface)}
.drop.over{border-color:var(--ink);background:var(--bg)}
.row{display:flex;flex-wrap:wrap;gap:.6rem;align-items:center;margin-top:.8rem;font-size:.86rem;color:var(--muted)}
.row label{display:inline-flex;gap:.5rem;align-items:center}
input[type=color]{width:44px;height:32px;border:1px solid var(--hair);border-radius:var(--r-sm);background:var(--bg);padding:2px;cursor:pointer}
button.act{font:500 .9rem var(--sans);min-height:44px;padding:.55rem 1.2rem;border-radius:var(--r-pill);border:1px solid var(--hair);background:var(--bg);color:var(--ink);cursor:pointer}
button.act.pri{background:var(--ink);border-color:var(--ink);color:#fff}
button:disabled{opacity:.35;cursor:default}
.sum{font-size:.86rem;color:var(--muted);margin-top:.7rem}
.sum b{color:var(--ink);font-weight:500}
.err{color:var(--bad);font-size:.86rem;margin-top:.5rem}
.warn{font-size:.82rem;color:var(--warn-fg);margin-top:.7rem}
.warn li{margin-left:1.1rem}
.imgs{font-size:.8rem;color:var(--muted);margin-top:.6rem;overflow-wrap:anywhere}
.miss{color:var(--warn-fg)}
.note{font-size:.78rem;color:var(--muted);margin-top:1.4rem}
@media (max-width:600px){.o1{width:240px;height:240px;right:-120px;top:-130px}.o2{width:180px;height:180px;right:40px;top:-110px}.o3{display:none}}
</style>
</head>
<body>
<div class="page"><div class="wrap">
  <header>
    <span class="orb o2" aria-hidden="true"></span><span class="orb o3" aria-hidden="true"></span><span class="orb o1" aria-hidden="true"></span>
    <div class="topline"><p class="eyebrow">knowledge-handover</p><div class="lang" role="group"><button type="button" data-l="th">ไทย</button><button type="button" data-l="en">EN</button></div></div>
    <h1 data-t="title"></h1>
    <p class="lede" data-t="lede"></p>
  </header>

  <ol class="progress" aria-label="Progress">
    <li data-step="1"><span class="n">1</span><span data-t="p1"></span></li>
    <li data-step="2"><span class="n">2</span><span data-t="p2"></span></li>
    <li data-step="3"><span class="n">3</span><span data-t="p3"></span></li>
  </ol>

  <div class="step">
    <h2><span class="n">1</span><span data-t="s1"></span></h2>
    <textarea id="save" spellcheck="false"></textarea>
    <div class="sum" id="sum"></div>
    <div class="err" id="err"></div>
  </div>

  <div class="step">
    <h2><span class="n">2</span><span data-t="s2"></span></h2>
    <div class="drop" id="drop"><span data-t="drop"></span><input type="file" id="files" multiple accept="image/*" hidden></div>
    <div class="imgs" id="imgs"></div>
    <div class="row"><label><input type="checkbox" id="shrink" checked> <span data-t="shrink"></span></label></div>
  </div>

  <div class="step">
    <h2><span class="n">3</span><span data-t="s3"></span></h2>
    <div class="row"><label><span data-t="accent"></span> <input type="color" id="accent" value="#bf4520"></label></div>
    <div class="row">
      <button class="act pri" id="buildZip" disabled data-t="zip"></button>
      <button class="act" id="buildHtml" disabled data-t="html"></button>
      <button class="act" id="buildAi" disabled data-t="ai"></button>
    </div>
    <ul class="warn" id="warn"></ul>
  </div>

  <p class="note" data-t="privacy"></p>
</div></div>
<script>
/*__CORE__*/
</script>
<script>
(function () {
  'use strict';
  var TEMPLATE = /*__TEMPLATE__*/"";
  var FONTS = document.getElementById('kh-fonts').textContent;
  var TXT = {
    en: {
      title: 'Build your <em>Knowledge Pack</em>', lede: 'Turn the save block from your AI chat into a pack you can hand over: a START-HERE page, a file any AI can teach from, and your original images in one zip.',
      p1: 'Paste save block', p2: 'Add images', p3: 'Build',
      s1: 'Paste the latest save block (or several)', s2: 'Add your images (optional)', s3: 'Build',
      drop: 'Drop image files here, or click to choose. Use the file names the AI gave you, e.g. P01-S03.jpg',
      shrink: 'Shrink large photos inside START-HERE.html (originals stay untouched in visuals/)', accent: 'Accent colour',
      zip: 'Download pack (.zip)', html: 'START-HERE.html only', ai: 'PACK-FOR-AI.md only',
      privacy: 'Everything happens in this browser. Nothing is uploaded anywhere. Store and share the pack only through channels your organisation approves.',
      found: 'Pack', ver: 'version', tasks: 'tasks', procs: 'tasks with steps', needImgs: 'Images the pack expects', missing: 'missing', none: 'No images added.', added: 'added'
    },
    th: {
      title: 'สร้าง <em>Knowledge Pack</em>', lede: 'แปลงก้อนเซฟจากแชต AI ให้เป็นไฟล์ส่งต่องาน ได้หน้า START-HERE ไฟล์ที่ AI ใช้สอนได้ และภาพต้นฉบับ รวมใน zip ไฟล์เดียว',
      p1: 'วาง save block', p2: 'ใส่ภาพ', p3: 'สร้าง Pack',
      s1: 'วางก้อนเซฟล่าสุด (วางหลายก้อนพร้อมกันได้)', s2: 'ใส่ภาพ (ถ้ามี)', s3: 'สร้างไฟล์',
      drop: 'ลากไฟล์ภาพมาวางตรงนี้ หรือคลิกเพื่อเลือก ใช้ชื่อไฟล์ตามที่ AI บอก เช่น P01-S03.jpg',
      shrink: 'ย่อรูปใหญ่ในหน้า START-HERE.html (ภาพต้นฉบับใน visuals/ ไม่ถูกแก้)', accent: 'สีหลัก',
      zip: 'ดาวน์โหลด Pack (.zip)', html: 'เฉพาะ START-HERE.html', ai: 'เฉพาะ PACK-FOR-AI.md',
      privacy: 'ทุกอย่างทำงานในเบราว์เซอร์นี้ ไม่มีการอัปโหลดข้อมูลไปที่ไหน เก็บและส่งต่อ Pack ผ่านช่องทางที่องค์กรอนุญาตเท่านั้น',
      found: 'Pack', ver: 'เวอร์ชัน', tasks: 'งาน', procs: 'งานที่มีขั้นตอน', needImgs: 'ภาพที่ Pack ต้องใช้', missing: 'ยังไม่มี', none: 'ยังไม่ได้ใส่ภาพ', added: 'ใส่แล้ว'
    }
  };
  var lang = /^th/i.test(navigator.language || '') ? 'th' : 'en';
  var pack = null, images = {}, display = {};
  var $ = function (id) { return document.getElementById(id); };
  // Everything read from a pasted save block or a dropped file name is untrusted text.
  function esc(s) { return String(s == null ? '' : s).replace(/[&<>"']/g, function (c) { return '&#' + c.charCodeAt(0) + ';'; }); }

  function applyLang() {
    document.documentElement.lang = lang;
    document.querySelectorAll('[data-t]').forEach(function (e) { e.innerHTML = TXT[lang][e.getAttribute('data-t')]; });
    document.querySelectorAll('.lang button').forEach(function (b) { b.className = b.getAttribute('data-l') === lang ? 'on' : ''; });
    refresh();
  }
  document.querySelectorAll('.lang button').forEach(function (b) { b.onclick = function () { lang = b.getAttribute('data-l'); applyLang(); }; });

  function expected() {
    var out = [];
    ((pack && pack.processes) || []).forEach(function (p) { (p.steps || []).forEach(function (s) { if (s.image) out.push(s.image); }); });
    return out;
  }

  function refresh() {
    var t = TXT[lang];
    $('err').textContent = '';
    $('sum').innerHTML = '';
    var text = $('save').value.trim();
    pack = null;
    if (text) {
      try {
        var r = KHCore.parseSave(text);
        pack = r.pack;
        if (pack.accent && /^#[0-9a-f]{6}$/i.test(pack.accent) && !$('accent').dataset.touched) { $('accent').value = pack.accent; orbs(); }
        $('sum').innerHTML = t.found + ' <b>' + esc(pack.pack_id || '?') + '</b> · ' + t.ver + ' ' + esc(pack.version || 1) + ' · ' +
          (pack.tasks || []).length + ' ' + t.tasks + ' · ' + (pack.processes || []).length + ' ' + t.procs;
      } catch (e) { $('err').textContent = e.message; }
    }
    var exp = expected(), names = Object.keys(images);
    var html = names.length ? names.length + ' ' + t.added + ': ' + names.map(esc).join(', ') : t.none;
    if (exp.length) html += '<br>' + t.needImgs + ': ' + exp.map(function (n) { return images[n] ? esc(n) : '<span class="miss">' + esc(n) + ' (' + t.missing + ')</span>'; }).join(', ');
    $('imgs').innerHTML = html;
    ['buildZip', 'buildHtml', 'buildAi'].forEach(function (id) { $(id).disabled = !pack; });
    $('warn').innerHTML = '';
    builtFor = builtFor === text ? builtFor : null;
    setDone(1, !!pack);
    setDone(2, exp.length ? exp.every(function (n) { return images[n]; }) : names.length > 0);
    setDone(3, !!pack && builtFor === text);
    if (pack) KHCore.validate(pack, names).forEach(function (w) { var li = document.createElement('li'); li.textContent = w; $('warn').appendChild(li); });
  }
  var builtFor = null;
  function setDone(n, on) { document.querySelector('.progress [data-step="' + n + '"]').classList.toggle('done', on); }
  function built() { builtFor = $('save').value.trim(); setDone(3, true); }
  // Soft orbs in the header follow the chosen accent, as in START-HERE.html.
  function orbs() {
    var hx = $('accent').value, rgb = [1, 3, 5].map(function (i) { return parseInt(hx.slice(i, i + 2), 16) / 255; });
    var mx = Math.max.apply(null, rgb), mn = Math.min.apply(null, rgb), d = mx - mn, h = 0;
    if (d) { h = mx === rgb[0] ? (rgb[1] - rgb[2]) / d + (rgb[1] < rgb[2] ? 6 : 0) : mx === rgb[1] ? (rgb[2] - rgb[0]) / d + 2 : (rgb[0] - rgb[1]) / d + 4; h *= 60; }
    var st = document.documentElement.style;
    st.setProperty('--orb1', 'hsl(' + Math.round(h) + ',85%,72%)');
    st.setProperty('--orb2', 'hsl(' + Math.round(h + 40) + ',70%,86%)');
    st.setProperty('--orb3', 'hsl(' + Math.round(h + 300) + ',65%,88%)');
  }
  $('save').addEventListener('input', refresh);
  $('accent').addEventListener('input', function () { $('accent').dataset.touched = '1'; orbs(); });

  function shrink(file, bytes) {
    return new Promise(function (resolve) {
      if (!$('shrink').checked || !/^image\/(jpeg|png|webp)$/.test(file.type)) return resolve(null);
      var url = URL.createObjectURL(file), img = new Image();
      img.onload = function () {
        var max = 1600, w = img.naturalWidth, h = img.naturalHeight, sc = Math.min(1, max / Math.max(w, h));
        if (sc >= 1 && bytes.length < 600000) { URL.revokeObjectURL(url); return resolve(null); }
        var c = document.createElement('canvas'); c.width = Math.round(w * sc); c.height = Math.round(h * sc);
        c.getContext('2d').drawImage(img, 0, 0, c.width, c.height);
        c.toBlob(function (blob) {
          URL.revokeObjectURL(url);
          if (!blob) return resolve(null);
          blob.arrayBuffer().then(function (ab) { resolve({ bytes: new Uint8Array(ab), mime: 'image/jpeg' }); });
        }, 'image/jpeg', 0.85);
      };
      img.onerror = function () { URL.revokeObjectURL(url); resolve(null); };
      img.src = url;
    });
  }

  function addFiles(list) {
    var jobs = Array.prototype.map.call(list, function (f) {
      return f.arrayBuffer().then(function (ab) {
        var bytes = new Uint8Array(ab);
        images[f.name] = bytes;
        return shrink(f, bytes).then(function (d) { if (d) display[f.name] = d; else delete display[f.name]; });
      });
    });
    Promise.all(jobs).then(refresh);
  }
  var drop = $('drop');
  drop.onclick = function () { $('files').click(); };
  $('files').onchange = function (e) { addFiles(e.target.files); };
  drop.ondragover = function (e) { e.preventDefault(); drop.classList.add('over'); };
  drop.ondragleave = function () { drop.classList.remove('over'); };
  drop.ondrop = function (e) { e.preventDefault(); drop.classList.remove('over'); addFiles(e.dataTransfer.files); };

  function result() {
    var p = JSON.parse(JSON.stringify(pack));
    p.accent = $('accent').value;
    return KHCore.build(p, images, { template: TEMPLATE, fontsCss: FONTS, displayImages: display });
  }
  function download(name, data, type) {
    var blob = new Blob([data], { type: type });
    var a = document.createElement('a'); a.href = URL.createObjectURL(blob); a.download = name;
    document.body.appendChild(a); a.click(); setTimeout(function () { URL.revokeObjectURL(a.href); a.remove(); }, 1000);
  }
  function pick(r, suffix) { return r.files.filter(function (f) { return f.path === r.root + '/' + suffix; })[0]; }
  $('buildZip').onclick = function () { var r = result(); download(r.zipName, KHCore.zip(r.files), 'application/zip'); built(); };
  $('buildHtml').onclick = function () { var r = result(); download('START-HERE.html', pick(r, 'START-HERE.html').data, 'text/html'); built(); };
  $('buildAi').onclick = function () { var r = result(); download('PACK-FOR-AI.md', pick(r, 'PACK-FOR-AI.md').data, 'text/markdown'); built(); };

  applyLang();
  orbs();
})();
</script>
</body>
</html>
