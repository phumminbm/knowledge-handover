<!DOCTYPE html>
<html lang="__LANG__">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>__TITLE__</title>
<style>
/*__FONTS__*/
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
/* Monochrome, airy system: white surfaces, near-black ink, pill controls, colour only in small marks and soft orbs. */
:root{--bg:#fff;--surface:#f6f6f5;--ink:#0b0b0b;--muted:#5f5f5c;--faint:#8a8a86;--hair:#e6e6e4;--accent:#bf4520;--accent-tint:rgba(191,69,32,.1);--on-accent:#fff;
--ok:#2f6b3a;--bad:#b42318;--warn-bg:#fff4e5;--warn-fg:#7a4a00;--orb1:#f4a27e;--orb2:#e7dcff;--orb3:#dbeafc;
--r-pill:999px;--r-lg:24px;--r-md:16px;--r-sm:12px;--side:260px;
--sans:'Poppins','Prompt',system-ui,sans-serif;--head:'Prompt','Poppins',system-ui,sans-serif;--mono:ui-monospace,Menlo,Consolas,monospace}
html{scroll-behavior:smooth;-webkit-text-size-adjust:100%}
body{font-family:var(--sans);background:var(--bg);color:var(--ink);line-height:1.6;font-size:16px}
a{color:inherit}
button{font-family:var(--sans);cursor:pointer;color:inherit}
:focus-visible{outline:2px solid var(--ink);outline-offset:2px;border-radius:6px}
[hidden]{display:none!important}
/* Shell */
.shell{display:grid;grid-template-columns:var(--side) minmax(0,1fr);min-height:100vh}
.side{position:sticky;top:0;height:100vh;overflow-y:auto;background:var(--surface);border-right:1px solid var(--hair);padding:1.4rem 1rem 1.2rem;display:flex;flex-direction:column;gap:1.2rem;z-index:40}
.brand b{display:block;font-family:var(--head);font-weight:500;font-size:1rem;line-height:1.35;overflow-wrap:anywhere}
.brand span{display:block;font-size:.76rem;color:var(--muted);margin-top:.2rem}
.side nav,.navlist{display:grid;gap:2px;font-size:.9rem}
.navlist a,.navlist .grey{display:flex;align-items:center;gap:.6rem;padding:.5rem .7rem;border-radius:var(--r-sm);text-decoration:none;min-height:40px;overflow-wrap:anywhere}
.navlist a:hover{background:rgba(0,0,0,.04)}
.navlist a[aria-current="page"]{background:var(--bg);box-shadow:0 1px 2px rgba(0,0,0,.07);font-weight:500}
.navlist .grey{color:var(--faint);font-size:.86rem}
.navlist .lbl{font-size:.72rem;color:var(--muted);padding:.9rem .7rem .2rem}
.cnt{margin-left:auto;flex:none;font-size:.72rem;background:var(--bg);border:1px solid var(--hair);border-radius:var(--r-pill);padding:0 .5rem;color:var(--muted);font-weight:400}
.ring{flex:none;width:16px;height:16px;border-radius:50%;background:conic-gradient(var(--accent) var(--p,0%),#dcdcd9 0);position:relative}
.ring::after{content:"";position:absolute;inset:3px;border-radius:50%;background:var(--surface)}
.navlist a[aria-current="page"] .ring::after{background:var(--bg)}
.ico{flex:none;width:16px;height:16px;stroke:currentColor;fill:none;stroke-width:1.7;stroke-linecap:round;stroke-linejoin:round}
.side-foot{margin-top:auto;font-size:.72rem;color:var(--muted)}
.mainwrap{min-width:0;display:flex;flex-direction:column;overflow-x:clip}
.topbar{position:sticky;top:0;z-index:30;display:flex;align-items:center;gap:.7rem;padding:.75rem 2rem;background:rgba(255,255,255,.92);backdrop-filter:blur(8px);border-bottom:1px solid var(--hair)}
.topbar .ttl{display:none;font-weight:500;font-size:.92rem;flex:1;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.searchbtn{flex:1;max-width:440px;display:flex;align-items:center;gap:.6rem;border:1px solid var(--hair);border-radius:var(--r-pill);padding:.45rem .9rem;color:var(--muted);font-size:.88rem;background:var(--bg);text-align:left;min-height:40px}
.searchbtn kbd{margin-left:auto;font:500 .7rem var(--sans);border:1px solid var(--hair);border-radius:6px;padding:0 .4rem}
.iconbtn{flex:none;width:40px;height:40px;border-radius:50%;border:1px solid var(--hair);background:var(--bg);display:none;align-items:center;justify-content:center}
.ml{margin-left:auto}
#app{padding:2.4rem 2.6rem 4rem;max-width:880px;width:100%}
.scrim{display:none}
/* Buttons */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:.4rem;min-height:40px;padding:.5rem 1.1rem;border-radius:var(--r-pill);border:1px solid var(--hair);background:var(--bg);color:var(--ink);font:500 .9rem var(--sans);text-decoration:none;white-space:nowrap}
.btn:hover{border-color:#cfcfcc}
.btn.pri{background:var(--ink);border-color:var(--ink);color:#fff}
.btn.pri:hover{background:#2a2a2a}
.btn.big{min-height:48px;padding:.65rem 1.4rem;font-size:.95rem}
.btn.txt{border-color:transparent;background:none;color:var(--muted);padding-inline:.4rem}
.btn.txt:hover{color:var(--ink)}
.copied{font-size:.82rem;color:var(--ok);margin-left:.6rem}
/* Type */
h1,.h1{font-family:var(--head);font-weight:400;font-size:clamp(2rem,3vw + 1rem,3rem);line-height:1.12;letter-spacing:-.02em;text-wrap:balance;overflow-wrap:anywhere}
.page-h1{font-size:clamp(1.7rem,2vw + 1rem,2.3rem)}
.lede{color:var(--muted);margin-top:.6rem;max-width:62ch}
.meta,.sub{font-size:.82rem;color:var(--muted)}
.top{display:flex;flex-wrap:wrap;gap:.4rem .7rem;align-items:center;font-size:.8rem;color:var(--muted)}
.pill{border:1px solid var(--hair);border-radius:var(--r-pill);padding:.08rem .65rem;background:rgba(255,255,255,.75);font-size:.76rem}
.code-id{font-family:var(--mono);font-size:.72rem;color:var(--faint)}
.sec{margin-top:2.6rem}
.sec-h{display:flex;align-items:baseline;flex-wrap:wrap;gap:.3rem .7rem;margin-bottom:.8rem}
.sec-h h2{font-family:var(--head);font-weight:500;font-size:1.15rem}
.sec-h small{color:var(--muted);font-size:.8rem}
.sec-h .more{margin-left:auto;font-size:.84rem;text-decoration:none;font-weight:500}
/* Hero and orbs */
.hero{position:relative;padding:1.6rem 0 .6rem}
.hero>*{position:relative}
.orb{position:absolute!important;border-radius:50%;filter:blur(42px);pointer-events:none;z-index:0}
.o1{width:360px;height:360px;right:-150px;top:-190px;background:radial-gradient(circle at 35% 35%,#fff 0%,var(--orb1) 42%,transparent 70%);opacity:.85}
.o2{width:280px;height:280px;right:140px;top:-150px;background:radial-gradient(circle,var(--orb2),transparent 68%);opacity:.85}
.o3{width:220px;height:220px;right:30px;top:40px;background:radial-gradient(circle,var(--orb3),transparent 68%);opacity:.7}
.hero h1{margin-top:.8rem}
.progress{display:flex;align-items:center;gap:.8rem;margin-top:1.3rem;font-size:.82rem;color:var(--muted)}
.bar{height:4px;border-radius:4px;background:var(--surface);overflow:hidden;flex:1;max-width:240px}
.bar i{display:block;height:100%;border-radius:4px;background:var(--accent);transition:width .25s}
.cta{display:flex;flex-wrap:wrap;gap:.6rem;margin-top:1.2rem}
/* Tiles, lists, cards */
.tiles{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:.6rem;list-style:none}
.tile{background:var(--surface);border-radius:var(--r-md);padding:.9rem 1rem;display:flex;gap:.7rem;align-items:flex-start;font-size:.88rem}
.tile b{display:block;font-weight:500}
.tile div>span{display:block;font-size:.78rem;color:var(--muted)}
.num{flex:none;width:24px;height:24px;border-radius:50%;background:var(--ink);color:#fff;display:flex;align-items:center;justify-content:center;font-size:.74rem;font-weight:600}
.group{border:1px solid var(--hair);border-radius:var(--r-md);overflow:hidden}
.group>.row{display:flex;gap:1rem;padding:.85rem 1.1rem;align-items:flex-start}
.group>.row+.row{border-top:1px solid var(--hair)}
.row .t{flex:1;min-width:0;overflow-wrap:anywhere}
.row .t b{font-weight:500}
.row .t div{font-size:.82rem;color:var(--muted)}
.dot{flex:none;width:7px;height:7px;border-radius:50%;background:#cfcfcc;margin-top:.6rem}
.dot.soon{background:var(--accent)}
.when{white-space:nowrap;font-size:.8rem;color:var(--muted);text-align:right}
.when b{display:block;color:var(--ink);font-weight:500}
.glabel{font-size:.74rem;color:var(--muted);margin:1.6rem 0 .5rem}
.cards{display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:.7rem}
.card{border:1px solid var(--hair);border-radius:var(--r-lg);padding:1.2rem 1.3rem;display:flex;flex-direction:column;gap:.35rem;background:var(--bg)}
.card h3{font-weight:500;font-size:1rem;line-height:1.35;overflow-wrap:anywhere}
.card .bar{max-width:none;flex:none;margin-top:.4rem}
.card .acts{display:flex;flex-wrap:wrap;gap:.3rem;align-items:center;margin-top:auto;padding-top:.6rem}
.card.dashed{border-style:dashed;background:transparent}
.vlabel{display:inline-flex;align-self:flex-start;font-size:.7rem;border-radius:var(--r-pill);padding:.05rem .55rem;background:var(--surface);color:var(--muted)}
.empty{color:var(--muted);font-size:.9rem;padding:1rem 1.1rem}
/* Status markers: semantic colour, separate from the accent */
.notice{border-radius:var(--r-md);padding:.7rem .95rem;font-size:.88rem;margin-top:.8rem}
.notice b{font-weight:600}
.notice.warn{background:var(--warn-bg);color:var(--warn-fg)}
.notice.open{border:1px dashed #c9c9c6;color:var(--muted)}
.notice.safe{background:#fdecea;border:1px solid var(--bad);color:#7a1a12}
.chip{display:inline-flex;align-items:center;gap:.4rem;font-size:.74rem;border-radius:var(--r-pill);padding:.1rem .65rem;background:var(--surface);color:var(--muted);margin-top:.8rem;align-self:flex-start}
.chip::before{content:"";width:6px;height:6px;border-radius:50%;background:#a8a8a4}
.chip.ok{color:var(--ok);background:#eef6ef}
.chip.ok::before{background:var(--ok)}
.chip.warn{background:var(--warn-bg);color:var(--warn-fg)}
.chip.warn::before{background:#c27a00}
/* Ask AI popover */
.popover{position:absolute;right:2rem;top:calc(100% + .5rem);width:min(420px,calc(100vw - 2rem));background:var(--bg);border:1px solid var(--hair);border-radius:var(--r-md);box-shadow:0 20px 50px -20px rgba(0,0,0,.3);padding:1.1rem 1.2rem;z-index:60;font-size:.9rem}
.popover p{color:var(--muted);margin-bottom:.6rem}
.code{font-family:var(--mono);font-size:.82rem;background:var(--surface);border-radius:8px;padding:.5rem .7rem;display:block;margin-bottom:.8rem;overflow-wrap:anywhere}
/* Task page */
.back{display:inline-flex;font-size:.86rem;color:var(--muted);text-decoration:none;margin-bottom:.8rem}
.back:hover{color:var(--ink)}
.chips{display:flex;flex-wrap:wrap;gap:.4rem;margin-top:.9rem;align-items:center}
.tabs{display:inline-flex;gap:2px;padding:4px;border-radius:var(--r-pill);background:var(--surface);margin-top:1.4rem;max-width:100%;overflow-x:auto;scrollbar-width:none}
.tabs::-webkit-scrollbar{display:none}
.tabs button{border:0;background:none;border-radius:var(--r-pill);padding:.4rem .95rem;font-size:.86rem;color:var(--muted);white-space:nowrap;min-height:36px}
.tabs button[aria-selected="true"]{background:var(--bg);color:var(--ink);font-weight:500;box-shadow:0 1px 3px rgba(0,0,0,.1)}
.panel{padding-top:1.4rem}
.walk-top{display:flex;justify-content:space-between;font-size:.82rem;color:var(--muted)}
.walkbar{height:4px;border-radius:4px;background:var(--surface);margin:.45rem 0 1.1rem;overflow:hidden}
.walkbar i{display:block;height:100%;background:var(--accent);border-radius:4px;transition:width .25s}
.step-title{font-family:var(--head);font-weight:400;font-size:1.7rem;letter-spacing:-.015em;line-height:1.2;overflow-wrap:anywhere}
.walk{display:grid;grid-template-columns:minmax(0,1.15fr) minmax(0,1fr);gap:1.6rem;margin-top:1.2rem;align-items:start}
.walk.noimg{grid-template-columns:minmax(0,1fr)}
.shot{position:relative;border:1px solid var(--hair);border-radius:var(--r-lg);overflow:hidden;background:var(--surface)}
.shot img{display:block;width:100%;height:auto}
.pin{position:absolute;transform:translate(-50%,-50%);width:28px;height:28px;border-radius:50%;background:var(--accent);color:var(--on-accent);font-size:.8rem;font-weight:600;display:flex;align-items:center;justify-content:center;box-shadow:0 0 0 3px rgba(255,255,255,.95)}
.pin.u{background:#fff;color:var(--accent);border:2px dashed var(--accent)}
.pins{list-style:none;margin-top:.7rem;font-size:.86rem;display:grid;gap:.3rem}
.pins li{display:flex;gap:.55rem;align-items:baseline}
.pn{flex:none;width:20px;height:20px;border-radius:50%;background:var(--accent);color:var(--on-accent);font-size:.68rem;font-weight:600;display:inline-flex;align-items:center;justify-content:center}
.step p{margin-bottom:.7rem;overflow-wrap:anywhere}
.why{background:var(--surface);border-radius:var(--r-md);padding:.8rem 1rem;font-size:.9rem}
.why b{font-weight:500}
.facts{display:grid;gap:.4rem;margin-top:.9rem;font-size:.86rem}
.facts div{display:grid;grid-template-columns:6.5rem minmax(0,1fr);gap:.5rem}
.facts b{color:var(--muted);font-weight:400}
.choices{margin-top:1.1rem;display:grid;gap:.5rem}
.choices .q{font-weight:500}
.choice{display:flex;justify-content:space-between;align-items:center;gap:1rem;width:100%;text-align:left;background:var(--bg);border:1px solid var(--hair);border-radius:var(--r-md);padding:.85rem 1rem;font-size:.95rem}
.choice:hover{border-color:var(--ink)}
.nav{display:flex;flex-wrap:wrap;gap:.6rem;align-items:center;margin-top:1.2rem}
.kbd{font-size:.74rem;color:var(--faint);margin-left:auto}
.done{text-align:center;padding:2.4rem 1rem;align-items:center}
.done .big{font-size:2rem;color:var(--ok)}
.done h3{font-family:var(--head);font-weight:500;font-size:1.25rem}
.flow{display:flex;flex-direction:column;align-items:flex-start}
.fstep{background:var(--bg);border:1px solid var(--hair);border-radius:var(--r-sm);padding:.55rem .9rem;font-size:.9rem;max-width:560px;text-align:left;text-decoration:none}
.fstep.seen{border-color:var(--ok)}
.farrow{width:1px;height:16px;background:#cfcfcc;margin-left:1.4rem}
.fbr{font-size:.8rem;color:var(--muted);margin:.25rem 0 .25rem 1.4rem}
.diagram{overflow-x:auto;background:var(--bg);border:1px solid var(--hair);border-radius:var(--r-lg);padding:.8rem}
.list>.row{padding:.85rem 0;border-top:1px solid var(--hair)}
.list>.row:first-child{border-top:none}
.list .row b{font-weight:500}
.trio{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:.9rem;font-size:.9rem}
.trio .k{font-size:.72rem;color:var(--muted);display:block}
.quiz{padding:1rem 0;border-top:1px solid var(--hair);display:grid;gap:.4rem}
.quiz:first-child{border-top:none}
.quiz .sit{font-size:.86rem;color:var(--muted)}
.quiz .q{font-weight:500}
.fb{font-size:.9rem;margin-top:.3rem}
table{width:100%;border-collapse:collapse;font-size:.88rem}
td,th{text-align:left;vertical-align:top;padding:.7rem .4rem;border-top:1px solid var(--hair)}
th{font-size:.74rem;color:var(--muted);font-weight:500;border-top:none}
footer{margin-top:3.5rem;padding-top:1rem;border-top:1px solid var(--hair);font-size:.74rem;color:var(--faint);display:flex;justify-content:space-between;flex-wrap:wrap;gap:.5rem}
/* Phone */
@media (max-width:959px){
  .shell{grid-template-columns:minmax(0,1fr)}
  .side{display:none;position:fixed;left:0;top:0;bottom:0;width:min(86vw,320px);height:auto;box-shadow:0 0 60px rgba(0,0,0,.25);padding-top:calc(1.2rem + env(safe-area-inset-top,0px))}
  body.menu-open .side{display:flex}
  body.menu-open .scrim{display:block;position:fixed;inset:0;background:rgba(0,0,0,.35);z-index:35}
  .topbar{padding:.6rem max(1rem,env(safe-area-inset-right,0px)) .6rem max(1rem,env(safe-area-inset-left,0px))}
  .topbar .ttl{display:block}
  .searchbtn{flex:none;width:40px;padding:0;justify-content:center;border-radius:50%}
  .searchbtn span,.searchbtn kbd{display:none}
  .iconbtn{display:inline-flex}
  #ask-ai{padding-inline:.8rem}
  .popover{right:1rem}
  #app{padding:1.6rem max(1rem,env(safe-area-inset-right,0px)) 5rem max(1rem,env(safe-area-inset-left,0px))}
  .tiles,.trio{grid-template-columns:1fr}
  .walk{grid-template-columns:1fr}
  .o1{width:260px;height:260px;right:-130px;top:-140px}.o2{width:200px;height:200px;right:40px;top:-120px}.o3{display:none}
}
@media (hover:none){.kbd{display:none}}
@media (prefers-reduced-motion:reduce){*,*::before,*::after{transition:none!important;scroll-behavior:auto!important}}
@media print{.side,.topbar,.scrim,.orb,.nav,.acts,.tabs,.cta,.popover{display:none!important}.shell{display:block}#app{padding:0;max-width:none}}
</style>
</head>

<nav class="side" id="side"></nav>
<div class="scrim" id="scrim"></div>
<div class="mainwrap">
<header class="topbar" id="topbar"></header>
<main id="app" aria-live="polite"></main>
</div>
</div>

    var lede = [role.summary, [gv.team, gv.organization].filter(Boolean).join(' · ')].filter(Boolean).join(' — ');
    if (lede) hero.appendChild(el('p', { cls: 'lede', text: lede }));
    var tot = stepTotals();
    if (tot[1]) hero.appendChild(el('div', { cls: 'progress' }, [el('span', { text: T.learnedOf(tot[0], tot[1]) }),
      el('span', { cls: 'bar', role: 'progressbar', 'aria-valuemin': '0', 'aria-valuemax': String(tot[1]), 'aria-valuenow': String(tot[0]) }, [el('i', { style: 'width:' + Math.round(tot[0] / tot[1] * 100) + '%' })])]));
    var ft = firstTask();
    hero.appendChild(el('div', { cls: 'cta' }, [
      ft ? el('a', { cls: 'btn pri big', id: 'hero-go', href: '#/task/' + ft.id, text: T.start + ' ›' }) : null,
      el('a', { cls: 'btn big', href: '#/urgent', text: T.seeUrgent })
    ]));
    app.appendChild(hero);

    app.appendChild(el('section', { cls: 'sec', 'aria-label': T.guide }, [el('ol', { cls: 'tiles' }, [
      el('li', { cls: 'tile' }, [el('span', { cls: 'num', text: '1' }), el('div', null, [el('b', { text: T.g1 }), el('span', { text: T.g1s })])]),
      el('li', { cls: 'tile' }, [el('span', { cls: 'num', text: '2' }), el('div', null, [el('b', { text: T.g2 }), el('span', { text: T.g2s })])]),
      el('li', { cls: 'tile' }, [el('span', { cls: 'num', text: '3' }), el('div', null, [el('b', { text: T.g3 }), el('span', { text: T.g3s })])])
    ])]));

    var rows = urgentRows(), total = urgentCount();
    var us = el('section', { cls: 'sec' }, [el('div', { cls: 'sec-h' }, [el('h2', { text: T.urgent }), el('small', { text: T.urgentSub }),
      total > 3 ? el('a', { cls: 'more', href: '#/urgent', text: T.all + ' (' + total + ') ›' }) : null])]);
    var ex = expiredNotice(); if (ex) us.appendChild(ex);
    var box = el('div', { cls: 'group' });
    if (!rows.length) box.appendChild(el('div', { cls: 'empty', text: T.none }));
    rows.slice(0, 3).forEach(function (x) { box.appendChild(urgentRow(x)); });
    us.appendChild(box);
    app.appendChild(us);

    var grid = el('div', { cls: 'cards' });
    taskList().forEach(function (t) {
      var p = byId[t.id];
      if (!p) { grid.appendChild(el('div', { cls: 'card dashed' }, [el('h3', { text: t.name || '' }), el('div', { cls: 'meta', text: [t.frequency, T.notCaptured].filter(Boolean).join(' · ') })])); return; }
      grid.appendChild(taskCard(p, t));
    });
    app.appendChild(el('section', { cls: 'sec' }, [el('div', { cls: 'sec-h' }, [el('h2', { text: T.tasks }), el('small', { text: T.tasksSub })]), grid]));
    footer();
  }
  function taskCard(p, t) {
    var n = (p.steps || []).length, done = progress(p);
    return el('article', { cls: 'card' }, [
      el('h3', { text: p.name || t.name || '' }),
      el('div', { cls: 'meta', text: [p.frequency || t.frequency, n ? n + ' ' + T.steps : '', p.complete ? '' : T.incomplete].filter(Boolean).join(' · ') }),
      n ? el('div', { cls: 'bar', role: 'progressbar', 'aria-valuemin': '0', 'aria-valuemax': String(n), 'aria-valuenow': String(done) }, [el('i', { style: 'width:' + Math.round(done / n * 100) + '%' })]) : null,
      n ? el('div', { cls: 'meta', text: T.learned + ' ' + done + '/' + n }) : null,
      el('div', { cls: 'acts' }, [
        el('a', { cls: 'btn pri', href: '#/task/' + p.id, text: T.walk + ' ›' }),
        el('a', { cls: 'btn txt', href: '#/task/' + p.id + '/overview', text: T.overview })
      ])
    ]);
  }

  // ── Reference pages ────────────────────────────────────────────────────
  function pageHead(title) { app.appendChild(el('h1', { cls: 'page-h1', text: title })); }
  function urgentView() {
    pageHead(T.urgent);
    var ex = expiredNotice(); if (ex) app.appendChild(ex);
    var rows = urgentRows();
    var groups = [['deadlines', T.deadlines], ['inprog', T.inprog], ['waiting', T.waiting]];
    var any = false;
    groups.forEach(function (g) {
      var list = rows.filter(function (r) { return r.group === g[0]; });
      if (!list.length) return;
      any = true;
      app.appendChild(el('div', { cls: 'glabel', text: g[1] }));
      app.appendChild(el('div', { cls: 'group' }, list.map(urgentRow)));
    });
    if (has(H.watch)) { any = true; app.appendChild(el('div', { cls: 'glabel', text: T.watch })); app.appendChild(el('div', { cls: 'group' }, H.watch.map(function (d) { return urgentRow({ what: d.what, sub: d.why, item: d }); }))); }
    if (has(H.access)) {
      any = true;
      app.appendChild(el('div', { cls: 'glabel', text: T.access }));
      app.appendChild(el('div', { cls: 'group' }, H.access.map(function (d) { return urgentRow({ what: d.system, sub: [d.account_or_role, d.action ? '→ ' + (T.action[d.action] || d.action) : ''].filter(Boolean).join(' '), item: d }); })));
    }
    if (!any) app.appendChild(el('p', { cls: 'empty', text: T.none }));
    footer();
  }
  function questionsView() {
    pageHead(T.openQ);
    if (!OQ.length) app.appendChild(el('p', { cls: 'empty', text: T.noQ }));
    else app.appendChild(el('div', { cls: 'group', style: 'margin-top:1.4rem' }, OQ.map(function (q) {
      return el('div', { cls: 'row' }, [el('div', { cls: 't' }, [el('b', { text: q.question || '' }), q.who_to_ask ? el('div', { text: T.ask + ': ' + q.who_to_ask }) : null])]);
    })));
    footer();
  }
  function glossaryView() {
    pageHead(T.glossary);
    var g = (K.glossary || []).slice().sort(function (a, b) { return String(a.term || '').localeCompare(String(b.term || '')); });
    if (!g.length) app.appendChild(el('p', { cls: 'empty', text: T.noGloss }));
    else app.appendChild(el('div', { cls: 'group', style: 'margin-top:1.4rem' }, g.map(function (x) {
      return el('div', { cls: 'row' }, [el('div', { cls: 't' }, [el('b', { text: x.term || '' }), el('div', { text: x.meaning || '' })])]);
    })));
    footer();
  }
  function changesView() {
    pageHead(T.changes);
    var c = (K.change_log || []).slice().reverse();
    if (!c.length) app.appendChild(el('p', { cls: 'empty', text: T.noChanges }));
    else app.appendChild(el('div', { cls: 'group', style: 'margin-top:1.4rem' }, c.map(function (x) {
      return el('div', { cls: 'row' }, [el('div', { cls: 't' }, [el('b', { text: (x.date || '') + ' · v' + (x.version || '') }), el('div', { text: (x.change || '') + (x.by ? ' · ' + x.by : '') })])]);
    })));
    footer();
  }

  function footer() {
    app.appendChild(el('footer', null, [el('span', { text: T.made + ' · ' + (K.pack_id || '') + ' · v' + (K.version || 1) }), el('span', { text: T.share })]));
  }

  // ── Task ───────────────────────────────────────────────────────────────
  function flowList(p) {
    var f = el('div', { cls: 'flow' });
    (p.steps || []).forEach(function (s, i) {
      var prev = (p.steps || [])[i - 1];
      if (prev && !has(prev.branches) && !prev.next) f.appendChild(el('div', { cls: 'farrow' }));
      else if (prev) f.appendChild(el('div', { style: 'height:12px' }));
      f.appendChild(el('a', { cls: 'fstep' + (seen[s.id] ? ' seen' : ''), href: '#/task/' + p.id + '/walk/' + s.id, style: 'text-decoration:none;color:inherit' }, [(seen[s.id] ? '✓ ' : '') + (i + 1) + '. ' + (s.title || '')]));
      var title = function (id) { var t = (p.steps || []).filter(function (x) { return x.id === id; })[0]; return t ? t.title : id; };
      if (has(s.branches)) f.appendChild(el('div', { cls: 'fbr', text: s.branches.map(function (b) { return b.label + ' → ' + title(b.goto); }).join(' · ') }));
      else if (s.next) f.appendChild(el('div', { cls: 'fbr', text: s.next === 'end' ? '→ ' + T.finish : '→ ' + title(s.next) }));
    });
    return f;
  }

  function task(pid, tab, stepId) {
    var p = byId[pid];
    if (!p) return home();
    clear();
    app.appendChild(el('a', { cls: 'back', href: '#/', text: T.home }));
    app.appendChild(el('h1', { cls: 'page-h1', text: p.name || '' }));
    if (p.summary) app.appendChild(el('p', { cls: 'lede', text: p.summary }));
    app.appendChild(el('div', { cls: 'chips' }, [
      p.frequency ? el('span', { cls: 'pill', text: T.freq + ': ' + p.frequency }) : null,
      p.trigger ? el('span', { cls: 'pill', text: T.trigger + ': ' + p.trigger }) : null,
      el('span', { cls: 'code-id', text: p.id })
    ]));
    if (!p.complete) app.appendChild(el('div', { cls: 'notice open', text: T.incNote }));

    var tabs = [];
    if (has(p.steps)) tabs.push(['walk', T.walk]);
    tabs.push(['overview', T.overview]);
    if (has(p.rules)) tabs.push(['rules', T.tRules]);
    if (has(p.troubleshooting)) tabs.push(['trouble', T.tTrouble]);
    if (has(p.scenarios)) tabs.push(['quiz', T.tQuiz]);
    if (!tabs.some(function (t) { return t[0] === tab; })) tab = tabs[0][0];
    var bar = el('div', { cls: 'tabs', role: 'tablist' });
    tabs.forEach(function (t) {
      bar.appendChild(el('button', { type: 'button', role: 'tab', 'aria-selected': String(t[0] === tab), text: t[1], onclick: function () { location.hash = '#/task/' + p.id + '/' + t[0]; } }));
    });
    app.appendChild(bar);
    var sel = bar.querySelector('[aria-selected="true"]');
    if (sel && bar.scrollWidth > bar.clientWidth) bar.scrollLeft = Math.max(0, (sel.previousElementSibling || sel).offsetLeft - bar.offsetLeft);
    var panel = el('section', { cls: 'panel', role: 'tabpanel' });
    app.appendChild(panel);
    ({ walk: walk, overview: overview, rules: rules, trouble: trouble, quiz: quiz })[tab](p, panel, stepId);
    footer();
  }

  // Diagrams arrive as SVG text inside the Pack, and a Pack is passed between people,
  // so treat it as untrusted: parse it in an inert document (nothing runs there), keep only
  // drawing elements, drop event handlers and every link or URL that leaves the diagram.
  var SVG_NS = 'http://www.w3.org/2000/svg';
  var SVG_TAGS = { svg: 1, g: 1, defs: 1, title: 1, desc: 1, style: 1, path: 1, rect: 1, circle: 1, ellipse: 1, line: 1,
    polyline: 1, polygon: 1, text: 1, tspan: 1, textpath: 1, marker: 1, pattern: 1, lineargradient: 1,
    radialgradient: 1, stop: 1, clippath: 1, mask: 1, symbol: 1, use: 1 };
  function cleanCss(s) {
    return String(s).replace(/@import[^;]*;?/gi, '').replace(/url\(\s*(['"]?)\s*(?!#)[^)]*\)/gi, 'none').replace(/expression\s*\(/gi, '');
  }
  function safeSvg(markup) {
    var doc = new DOMParser().parseFromString(markup, 'text/html');
    var root = doc.body.firstElementChild;
    if (!root || root.namespaceURI !== SVG_NS || root.localName !== 'svg') return null;
    (function clean(node) {
      Array.prototype.slice.call(node.children).forEach(function (c) {
        if (c.namespaceURI !== SVG_NS || !SVG_TAGS[c.localName.toLowerCase()]) c.remove();
        else clean(c);
      });
      Array.prototype.slice.call(node.attributes).forEach(function (a) {
        var n = a.name.toLowerCase(), v = a.value;
        if (/^on/.test(n) || (/(^|:)href$/.test(n) && v.trim().charAt(0) !== '#') || /javascript:|data:/i.test(v)) node.removeAttribute(a.name);
        else if (n === 'style') node.setAttribute(a.name, cleanCss(v));
      });
      if (node.localName === 'style') node.textContent = cleanCss(node.textContent);
    })(root);
    return document.importNode(root, true);
  }

  function overview(p, panel) {
    var svg = p.diagram_svg && /^\s*<svg[\s>]/i.test(p.diagram_svg) ? safeSvg(p.diagram_svg) : null;
    if (svg) {
      panel.appendChild(el('div', { cls: 'diagram' }, [svg]));
    } else if (has(p.steps)) panel.appendChild(flowList(p));
    else panel.appendChild(el('p', { cls: 'meta', text: T.noStep }));
    if (has(p.people)) panel.appendChild(el('div', { cls: 'card list', style: 'margin-top:1rem' }, [el('div', { cls: 'group', text: T.people, style: 'margin-top:0' })].concat(
      p.people.map(function (x) { return el('div', { cls: 'row' }, [el('b', { text: x.name_or_role || '' }), el('div', { cls: 'sub', text: x.involvement || '' })]); }))));
    if (has(p.systems)) panel.appendChild(el('div', { cls: 'card list', style: 'margin-top:1rem' }, [el('div', { cls: 'group', text: T.systems, style: 'margin-top:0' })].concat(
      p.systems.map(function (x) { return el('div', { cls: 'row' }, [el('b', { text: x.name || '' }), el('div', { cls: 'sub', text: (x.purpose || '') + (x.source_of_truth ? ' · ' + T.sot : '') })]); }))));
  }

  var keyHandler = null;
  function walk(p, panel, stepId) {
    var steps = p.steps || [];
    var index = {};
    steps.forEach(function (s, i) { index[s.id] = i; });
    var cur = stepId && stepId in index ? index[stepId] : 0;
    var hist = [];
    function go(i) { hist.push(cur); cur = i; draw(); }
    // Where a step without branches leads: its `next` (a step ID or "end"), otherwise the following step.
    function after(i) {
      var n = steps[i].next;
      if (n === 'end') return -1;
      if (n && n in index) return index[n];
      return i < steps.length - 1 ? i + 1 : -1;
    }
    function draw() {
      panel.innerHTML = '';
      if (cur === -1) return finished();
      var s = steps[cur];
      markSeen(s.id);
      panel.appendChild(el('div', { cls: 'walk-top' }, [el('span', { text: T.step + ' ' + (cur + 1) + ' ' + T.of + ' ' + steps.length }), el('span', { cls: 'code-id', text: s.id })]));
      panel.appendChild(el('div', { cls: 'walkbar' }, [el('i', { style: 'width:' + Math.round((cur + 1) / steps.length * 100) + '%' })]));
      var src = s.image && IMG[s.image];
      var left = null;
      if (src) {
        var shot = el('div', { cls: 'shot' }, [el('img', { src: src, alt: s.title || s.id })]);
        (s.pins || []).forEach(function (pin) {
          shot.appendChild(el('span', { cls: 'pin' + (pin.confirmed ? '' : ' u'), style: 'left:' + (pin.x * 100) + '%;top:' + (pin.y * 100) + '%', 'aria-hidden': 'true', text: String(pin.n) }));
        });
        left = el('div', null, [shot, has(s.pins) ? el('ul', { cls: 'pins' }, s.pins.map(function (pin) {
          return el('li', null, [el('span', { cls: 'pn', text: String(pin.n) }), (pin.label || '') + (pin.confirmed ? '' : ' (' + T.pinWait + ')')]);
        })) : null]);
      }
      var facts = el('div', { cls: 'facts' }, [
        s.check ? el('div', null, [el('b', { text: T.check + ': ' }), s.check]) : null,
        has(s.inputs) ? el('div', null, [el('b', { text: T.inputs + ': ' }), s.inputs.join(', ')]) : null,
        has(s.outputs) ? el('div', null, [el('b', { text: T.outputs + ': ' }), s.outputs.join(', ')]) : null,
        s.system ? el('div', null, [el('b', { text: T.system + ': ' }), s.system]) : null,
        s.actor ? el('div', null, [el('b', { text: T.who + ': ' }), s.actor]) : null
      ]);
      panel.appendChild(el('h3', { cls: 'step-title', text: s.title || '' }));
      var right = el('div', { cls: 'step' }, [
        s.detail ? el('p', { text: s.detail }) : null,
        s.why ? el('div', { cls: 'why' }, [el('b', { text: T.why + ': ' }), s.why]) : null,
        s.safety ? el('div', { cls: 'notice safe' }, [el('b', { text: T.safety }), ' · ' + T.safetyNote]) : null,
        facts,
        statusBlock(s, p.id)
      ]);
      if (has(s.branches)) {
        var ch = el('div', { cls: 'choices' }, [el('div', { cls: 'q', text: s.branch_question || T.which })]);
        s.branches.forEach(function (b) {
          ch.appendChild(el('button', { cls: 'choice', type: 'button', onclick: function () { if (b.goto in index) go(index[b.goto]); } }, [el('span', { text: b.label || '' }), el('span', { text: '›', 'aria-hidden': 'true' })]));
        });
        right.appendChild(ch);
      }
      var nav = el('div', { cls: 'nav' });
      if (!has(s.branches)) {
        if (after(cur) >= 0) nav.appendChild(el('button', { cls: 'btn pri big', type: 'button', text: T.next + ' ›', onclick: function () { go(after(cur)); } }));
        else nav.appendChild(el('button', { cls: 'btn pri big', type: 'button', text: T.finish + ' ✓', onclick: function () { go(-1); } }));
      }
      if (hist.length) nav.appendChild(el('button', { cls: 'btn', type: 'button', text: '‹ ' + T.back, onclick: function () { cur = hist.pop(); draw(); } }));
      nav.appendChild(copyButton(T.askAI, T.aiStep(s)));
      nav.appendChild(el('span', { cls: 'kbd', text: T.keys }));
      right.appendChild(nav);
      panel.appendChild(el('div', { cls: 'walk' + (left ? '' : ' noimg') }, [left, right]));
    }
    function finished() {
      panel.appendChild(el('div', { cls: 'card done' }, [el('div', { cls: 'big', text: '✓' }), el('h3', { text: T.doneTitle }), el('p', { cls: 'meta', text: T.doneSub }),
        el('div', { cls: 'nav', style: 'justify-content:center' }, [
          has(p.scenarios) ? el('a', { cls: 'btn pri', href: '#/task/' + p.id + '/quiz', text: T.tryQuiz }) : null,
          el('button', { cls: 'btn', type: 'button', text: T.again, onclick: function () { hist = []; cur = 0; draw(); } }),
          el('a', { cls: 'btn', href: '#/', text: T.home })
        ])]));
    }
    if (keyHandler) document.removeEventListener('keydown', keyHandler);
    keyHandler = function (e) {
      if (!panel.isConnected || /input|textarea/i.test((e.target || {}).tagName || '')) return;
      if (e.key === 'ArrowLeft' && hist.length) { cur = hist.pop(); draw(); }
      if (e.key === 'ArrowRight' && cur >= 0 && !has(steps[cur].branches)) go(after(cur));
    };
    document.addEventListener('keydown', keyHandler);
    draw();
  }

  function rules(p, panel) {
    panel.appendChild(el('div', { cls: 'card list' }, p.rules.map(function (r) {
      return el('div', { cls: 'row' }, [el('b', { text: r.text || '' }), r.why ? el('div', { cls: 'sub', text: T.why + ': ' + r.why }) : null,
        r.applies_when ? el('div', { cls: 'sub', text: r.applies_when }) : null, statusBlock(r, p.id), el('div', { cls: 'code-id', text: r.id })]);
    })));
  }

  function trouble(p, panel) {
    p.troubleshooting.forEach(function (t) {
      panel.appendChild(el('div', { cls: 'card', style: 'margin-bottom:.8rem' }, [el('div', { cls: 'trio' }, [
        el('div', null, [el('span', { cls: 'k', text: T.symptom }), t.symptom || '']),
        el('div', null, [el('span', { cls: 'k', text: T.cause }), t.cause || '']),
        el('div', null, [el('span', { cls: 'k', text: T.fix }), t.fix || ''])
      ]), statusBlock(t, p.id)]));
    });
  }

  function quiz(p, panel) {
    var box = el('div', { cls: 'card' });
    p.scenarios.forEach(function (q) {
      var fb = el('div', { cls: 'fb', role: 'status' });
      box.appendChild(el('div', { cls: 'quiz' }, [q.situation ? el('div', { cls: 'sit', text: q.situation }) : null, el('div', { cls: 'q', text: q.question || '' })].concat(
        (q.options || []).map(function (o, i) {
          return el('button', { cls: 'choice', type: 'button', onclick: function () {
            var ok = i === q.answer;
            fb.textContent = (ok ? '✓ ' + T.correct : '✗ ' + T.wrong) + (q.explanation ? ' — ' + q.explanation : '');
            fb.style.color = ok ? 'var(--ok)' : 'var(--bad)';
          } }, [el('span', { text: o })]);
        }), [fb])));
    });
    panel.appendChild(box);
  }

  // ── Router ─────────────────────────────────────────────────────────────
  var VIEWS_REF = { '#/urgent': urgentView, '#/questions': questionsView, '#/glossary': glossaryView, '#/changes': changesView };
  function route() {
    var h = location.hash || '';
    var m = h.match(/^#\/task\/([^/]+)(?:\/([a-z]+))?(?:\/(.+))?$/);
    setMenu(false);
    clear();
    if (m && byId[decodeURIComponent(m[1])]) {
      var pid = decodeURIComponent(m[1]);
      renderSide('#/task/' + pid);
      return task(pid, m[2] || 'walk', m[3] ? decodeURIComponent(m[3]) : null);
    }
    if (VIEWS_REF[h]) { renderSide(h); return VIEWS_REF[h](); }
    renderSide('#/');
    home();
  }
  renderTop();
  window.addEventListener('hashchange', route);
  route();
})();
</script>
</body>
