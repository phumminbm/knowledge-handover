<!DOCTYPE html>
<html lang="__LANG__">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>__TITLE__</title>
<style>
/*__FONTS__*/
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
:root{--paper:#f5f5f5;--card:#fff;--ink:#2d3142;--muted:#4f5d75;--soft:#5a6580;--faint:#8a93a6;--rule:rgba(45,49,66,.12);--accent:#bf4520;--accent-tint:rgba(191,69,32,.08);--ok:#2f6b3a;--bad:#b42318;--sans:'Poppins','Prompt',system-ui,sans-serif;--mono:'Geist Mono',ui-monospace,Menlo,Consolas,monospace}
html{scroll-behavior:smooth}
body{font-family:var(--sans);background:var(--paper);color:var(--ink);line-height:1.6;padding:2rem 1.1rem 4rem}
.wrap{max-width:980px;margin:0 auto}
a{color:inherit}
button{font-family:var(--sans);cursor:pointer}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.top{font-size:.8rem;color:var(--muted);display:flex;flex-wrap:wrap;gap:.4rem .8rem;align-items:center;margin-bottom:.6rem}
.pill{border:1px solid var(--rule);background:var(--card);border-radius:999px;padding:.05rem .6rem;font-size:.74rem}
h1{font-family:'Prompt','Poppins',sans-serif;font-size:clamp(1.55rem,2.2vw + 1rem,2.2rem);font-weight:600;line-height:1.25}
.lede{color:var(--muted);margin-top:.35rem;max-width:70ch}
h2{font-size:1.1rem;font-weight:600;margin:2rem 0 .75rem}
h2 small{font-weight:400;color:var(--muted);font-size:.82rem;margin-left:.5rem}
.card{background:var(--card);border:1px solid var(--rule);border-radius:8px;padding:1.1rem 1.2rem}
.guide{background:var(--accent-tint);border-color:rgba(191,69,32,.35);margin-top:1.4rem}
.guide h3{font-size:.95rem;font-weight:600;margin-bottom:.6rem}
.guide ol{list-style:none;display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:.8rem}
@media(max-width:720px){.guide ol{grid-template-columns:1fr}}
.guide li{display:flex;gap:.6rem;font-size:.9rem;align-items:flex-start}
.num{flex:none;width:26px;height:26px;border-radius:50%;background:var(--accent);color:#fff;font-weight:600;font-size:.82rem;display:flex;align-items:center;justify-content:center}
.guide li b{display:block}
.guide li div span{display:block;color:var(--muted);font-size:.84rem}
.notice{border-radius:6px;padding:.6rem .85rem;font-size:.88rem;margin-top:.8rem}
.notice.warn{background:var(--accent-tint);border:1px solid var(--accent)}
.notice.open{border:1px dashed rgba(45,49,66,.45);background:#fff}
.notice.safe{background:#fdecea;border:1px solid var(--bad)}
.notice b{font-weight:600}
.urgent .item{display:flex;justify-content:space-between;gap:1rem;padding:.6rem 0;border-top:1px solid var(--rule);font-size:.92rem}
.urgent .item:first-of-type{border-top:none}
.urgent .what b{font-weight:600}
.urgent .what div{color:var(--muted);font-size:.82rem}
.when{white-space:nowrap;font-size:.84rem;color:var(--muted);text-align:right}
.when.soon{color:var(--accent);font-weight:600}
.group{font-size:.78rem;font-weight:600;color:var(--soft);margin:1rem 0 .1rem}
.linkbtn{background:none;border:none;color:var(--accent);font-size:.86rem;padding:.4rem 0;margin-top:.3rem;font-weight:500}
.tasks{display:grid;grid-template-columns:repeat(auto-fill,minmax(270px,1fr));gap:.9rem}
.task{background:var(--card);border:1px solid var(--rule);border-radius:8px;padding:1rem 1.1rem;display:flex;flex-direction:column;gap:.35rem}
.task h3{font-size:1rem;font-weight:600;line-height:1.35}
.meta{font-size:.82rem;color:var(--muted)}
.bar{height:5px;background:rgba(45,49,66,.08);border-radius:3px;overflow:hidden;margin:.3rem 0}
.bar i{display:block;height:100%;background:var(--accent);border-radius:3px;transition:width .25s}
.task .acts{display:flex;gap:.5rem;margin-top:auto;padding-top:.4rem;flex-wrap:wrap}
.task.muted{background:transparent;border-style:dashed}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:.35rem;min-height:40px;padding:.4rem 1rem;border-radius:6px;border:1px solid var(--ink);background:#fff;color:var(--ink);font-size:.9rem;text-decoration:none}
.btn.pri{background:var(--ink);color:#fff}
.btn.big{min-height:48px;font-size:1rem;padding:.5rem 1.3rem}
.btn:hover{opacity:.88}
.ai p{font-size:.9rem;color:var(--muted);margin-bottom:.6rem}
.ai code,.code{font-family:var(--mono);font-size:.82rem;background:rgba(45,49,66,.06);border-radius:4px;padding:.05rem .35rem;color:var(--ink)}
.copied{font-size:.82rem;color:var(--ok);margin-left:.6rem}
details{background:var(--card);border:1px solid var(--rule);border-radius:8px;margin-top:.75rem}
summary{cursor:pointer;padding:.85rem 1.1rem;font-weight:600;font-size:.92rem;list-style:none}
summary::-webkit-details-marker{display:none}
summary::after{content:'+';float:right;color:var(--muted)}
details[open] summary::after{content:'−'}
details .in{padding:0 1.1rem 1rem}
table{width:100%;border-collapse:collapse;font-size:.86rem}
td,th{text-align:left;vertical-align:top;padding:.5rem .3rem;border-top:1px solid var(--rule)}
th{font-size:.78rem;color:var(--soft);font-weight:600;border-top:none}
.back{display:inline-block;font-size:.88rem;color:var(--muted);text-decoration:none;margin-bottom:.8rem}
.back:hover{color:var(--accent)}
.code-id{font-family:var(--mono);font-size:.72rem;color:var(--faint)}
.chips{display:flex;flex-wrap:wrap;gap:.4rem;margin-top:.7rem}
.tabs{display:flex;gap:.25rem;border-bottom:1px solid var(--rule);margin-top:1.4rem;overflow-x:auto;scrollbar-width:none}
.tabs button{background:none;border:none;border-bottom:2px solid transparent;padding:.6rem .9rem;font-size:.92rem;color:var(--muted);white-space:nowrap;min-height:44px}
@media(max-width:780px){.tabs{-webkit-mask-image:linear-gradient(90deg,#000 85%,transparent);mask-image:linear-gradient(90deg,#000 85%,transparent);padding-right:2rem}.tabs button{padding:.6rem .65rem}}
@media(hover:none){.kbd{display:none}}
.list .group+.row{border-top:none}
.tabs button[aria-selected="true"]{color:var(--accent);border-bottom-color:var(--accent);font-weight:600}
.panel{padding-top:1.2rem}
.walk-top{display:flex;justify-content:space-between;font-size:.86rem;color:var(--muted)}
.walk{display:grid;grid-template-columns:minmax(0,1.15fr) minmax(0,1fr);gap:1.4rem;margin-top:.8rem;align-items:start}
.walk.noimg{grid-template-columns:minmax(0,1fr)}
@media(max-width:780px){.walk{grid-template-columns:1fr}}
.shot{position:relative;border:1px solid var(--rule);border-radius:8px;overflow:hidden;background:#fff}
.shot img{display:block;width:100%;height:auto}
.pin{position:absolute;transform:translate(-50%,-50%);width:28px;height:28px;border-radius:50%;background:var(--accent);color:#fff;font-size:.8rem;font-weight:600;display:flex;align-items:center;justify-content:center;box-shadow:0 0 0 3px rgba(255,255,255,.9)}
.pin.u{background:#fff;color:var(--accent);border:2px dashed var(--accent)}
.pins{list-style:none;margin-top:.5rem;font-size:.85rem;color:var(--muted)}
.pins li{display:flex;gap:.5rem;align-items:baseline;padding:.15rem 0}
.pins .pn{flex:none;width:20px;height:20px;border-radius:50%;background:var(--accent);color:#fff;font-size:.7rem;font-weight:600;display:inline-flex;align-items:center;justify-content:center}
.step-title{font-size:1.25rem;font-weight:600;line-height:1.35;margin:.9rem 0 0}
.step p{font-size:.96rem;margin-bottom:.6rem}
.why{background:#fff;border:1px solid var(--rule);border-radius:6px;padding:.6rem .8rem;font-size:.9rem;margin-bottom:.6rem}
.why b{font-weight:600}
.facts{font-size:.86rem;color:var(--muted)}
.facts div{padding:.1rem 0}
.facts b{color:var(--ink);font-weight:500}
.status-small{font-size:.78rem;color:var(--faint);margin-top:.4rem}
.status-small.ok{color:var(--ok)}
.choices{margin-top:1rem}
.choices .q{font-weight:600;margin-bottom:.4rem}
.choice{display:flex;justify-content:space-between;align-items:center;width:100%;text-align:left;background:#fff;border:1px solid var(--ink);border-radius:6px;padding:.7rem .9rem;font-size:.95rem;margin-top:.45rem;min-height:48px}
.choice:hover{border-color:var(--accent);color:var(--accent)}
.nav{display:flex;flex-wrap:wrap;gap:.6rem;align-items:center;margin-top:1rem}
.kbd{font-size:.76rem;color:var(--faint);margin-left:auto}
.done{text-align:center;padding:2rem 1rem}
.done .big{font-size:2.2rem;color:var(--ok)}
.done h3{font-size:1.2rem;margin:.3rem 0 .4rem}
.flow{display:flex;flex-direction:column;align-items:flex-start}
.fstep{background:#fff;border:1px solid var(--ink);border-radius:6px;padding:.5rem .8rem;font-size:.9rem;max-width:560px;text-align:left}
.fstep.seen{border-color:var(--ok)}
.farrow{width:1px;height:16px;background:var(--muted);margin-left:1.4rem}
.fbr{font-size:.8rem;color:var(--muted);margin:.25rem 0 .25rem 1.4rem}
.diagram{overflow-x:auto;background:#fff;border:1px solid var(--rule);border-radius:8px;padding:.5rem}
.list .row{padding:.8rem 0;border-top:1px solid var(--rule)}
.list .row:first-child{border-top:none}
.list .row b{font-weight:600}
.list .sub{font-size:.86rem;color:var(--muted);margin-top:.2rem}
.trio{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:.8rem;font-size:.9rem}
@media(max-width:720px){.trio{grid-template-columns:1fr}}
.trio .k{font-size:.74rem;font-weight:600;color:var(--soft);display:block}
.quiz{padding:1rem 0;border-top:1px solid var(--rule)}
.quiz:first-child{border-top:none}
.quiz .sit{font-size:.86rem;color:var(--muted)}
.quiz .q{font-weight:600;margin:.2rem 0 .3rem}
.fb{font-size:.9rem;margin-top:.5rem}
footer{margin-top:3rem;padding-top:1rem;border-top:1px solid var(--rule);font-size:.76rem;color:var(--faint);display:flex;justify-content:space-between;flex-wrap:wrap;gap:.5rem}
@media print{.tabs,.nav,.acts,.guide,.ai{display:none}body{padding:.5rem}}
</style>
</head>

  // Diagrams arrive as SVG text inside the Pack, and a Pack is passed between people,

  var SVG_NS = 'http://www.w3.org/2000/svg';

  var keyHandler = null;
  function walk(p, panel, stepId) {
    var steps = p.steps || [];
    var index = {};
    steps.forEach(function (s, i) { index[s.id] = i; });
    var cur = stepId && stepId in index ? index[stepId] : 0;
    var hist = [];
    function go(i) { hist.push(cur); cur = i; draw(); }
    // Where a step without branches leads: its `next` (a step ID or "end"), otherwise the following step.
    function after(i) {

      panel.appendChild(el('div', { cls: 'walk-top' }, [el('span', { text: T.step + ' ' + (cur + 1) + ' ' + T.of + ' ' + steps.length }), el('span', { cls: 'code-id', text: s.id })]));

        has(s.outputs) ? el('div', null, [el('b', { text: T.outputs + ': ' }), s.outputs.join(', ')]) : null,
        s.system ? el('div', null, [el('b', { text: T.system + ': ' }), s.system]) : null,
        s.actor ? el('div', null, [el('b', { text: T.who + ': ' }), s.actor]) : null
      ]);
      panel.appendChild(el('h3', { cls: 'step-title', text: s.title || '' }));

        });

        else nav.appendChild(el('button', { cls: 'btn pri big', type: 'button', text: T.finish + ' ✓', onclick: function () { go(-1); } }));
      }

      nav.appendChild(el('span', { cls: 'kbd', text: T.keys }));
      right.appendChild(nav);

    }
    function finished() {
      panel.appendChild(el('div', { cls: 'card done' }, [el('div', { cls: 'big', text: '✓' }), el('h3', { text: T.doneTitle }), el('p', { cls: 'meta', text: T.doneSub }),

          el('a', { cls: 'btn', href: '#/', text: T.home })
        ])]));
    }
    if (keyHandler) document.removeEventListener('keydown', keyHandler);
    keyHandler = function (e) {

    document.addEventListener('keydown', keyHandler);
    draw();
  }

    p.troubleshooting.forEach(function (t) {
      panel.appendChild(el('div', { cls: 'card', style: 'margin-bottom:.8rem' }, [el('div', { cls: 'trio' }, [
        el('div', null, [el('span', { cls: 'k', text: T.symptom }), t.symptom || '']),
        el('div', null, [el('span', { cls: 'k', text: T.cause }), t.cause || '']),
        el('div', null, [el('span', { cls: 'k', text: T.fix }), t.fix || ''])
      ]), statusBlock(t, p.id)]));
    });
  }

  function quiz(p, panel) {
    var box = el('div', { cls: 'card' });
    p.scenarios.forEach(function (q) {
      var fb = el('div', { cls: 'fb', role: 'status' });
      box.appendChild(el('div', { cls: 'quiz' }, [q.situation ? el('div', { cls: 'sit', text: q.situation }) : null, el('div', { cls: 'q', text: q.question || '' })].concat(
        (q.options || []).map(function (o, i) {
          return el('button', { cls: 'choice', type: 'button', onclick: function () {
            var ok = i === q.answer;
            fb.textContent = (ok ? '✓ ' + T.correct : '✗ ' + T.wrong) + (q.explanation ? ' — ' + q.explanation : '');
            fb.style.color = ok ? 'var(--ok)' : 'var(--bad)';
          } }, [el('span', { text: o })]);
        }), [fb])));
    });
    panel.appendChild(box);
  }

  // ── Router ─────────────────────────────────────────────────────────────
  function route() {
    var m = (location.hash || '').match(/^#\/task\/([^/]+)(?:\/([a-z]+))?(?:\/(.+))?$/);
    if (m) task(decodeURIComponent(m[1]), m[2] || 'walk', m[3] ? decodeURIComponent(m[3]) : null);
    else home();
  }
  window.addEventListener('hashchange', route);
  route();
})();
</script>
</body>
</html>
